<button class="btn blog-btn-accent mb-3 w-100" data-bs-toggle="modal" data-bs-target="#exampleModal"
    (click)="openAddModal()">+ Create New Post</button>
<app-form [type]="type()" [post]="postToEdit()" (updatedPost)="PostUpdate($event)"></app-form>

<div class="row">
    @for (post of blogPosts(); track post.id) {
    <div class="col-lg-12">
        <app-post [post]="post" [buttons]="true" (updatePost)="EditPost($event)"></app-post>
    </div>
    } @empty {
    <p>No posts found.</p>
    }
</div>

@if(totalPages() > 1) {
<app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)"></app-pagination>
}
